<!DOCTYPE html>
<html>
<head>
    <title>GOES-18 Satellite Viewer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #1a1a2e; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* Disable browser bilinear smoothing on satellite image overlays */
        .leaflet-overlay-pane img {
            image-rendering: pixelated;
            image-rendering: crisp-edges; /* Firefox fallback */
        }

        #timestamp {
            position: absolute;
            bottom: 58px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }

        /* ---- Animation control bar ---- */
        #animation-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        #play-pause-btn {
            background: none;
            border: 1px solid #666;
            color: #fff;
            cursor: pointer;
            padding: 1px 7px;
            border-radius: 3px;
            font-size: 13px;
            line-height: 1.4;
            flex-shrink: 0;
        }
        #play-pause-btn:hover { border-color: #fff; }
        #frame-slider {
            width: 130px;
            cursor: pointer;
            accent-color: #7cf;
        }
        #frame-label {
            min-width: 52px;
            color: #7cf;
            text-align: right;
        }

        /* ---- Legend panel ---- */
        #legend {
            position: absolute;
            bottom: 30px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.72);
            color: #fff;
            padding: 10px 14px 8px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 12px;
            min-width: 220px;
            display: none;
        }
        #legend .legend-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            letter-spacing: 0.02em;
        }
        #legend .legend-subtitle {
            font-size: 10px;
            color: #bbb;
            margin-bottom: 6px;
        }
        #legend .legend-bar {
            height: 14px;
            border-radius: 3px;
            margin-bottom: 3px;
        }
        #legend .legend-ticks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #ccc;
            margin-bottom: 4px;
        }
        #legend .legend-unit {
            font-size: 10px;
            color: #aaa;
            text-align: right;
        }
        /* Caveat text for the experimental precipitation product */
        #legend .legend-note {
            font-size: 10px;
            line-height: 1.35;
            color: #f5b942;
            margin-top: 6px;
            max-width: 240px;
        }

        /* Swatch rows used by the GeoColor night legend */
        #legend .swatch-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 4px;
            font-size: 11px;
        }
        #legend .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="timestamp">Loading...</div>
    <div id="animation-controls">
        <button id="play-pause-btn" title="Play / Pause">⏸</button>
        <input type="range" id="frame-slider" min="0" max="9" value="9" step="1" title="Select frame">
        <span id="frame-label">▶ LIVE</span>
    </div>
    <div id="legend"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map — centered on GOES-18 nadir so the full disk is visible
        var map = L.map('map').setView([0, -137], 2);

        // Dark base layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Image bounds — MUST match EXTENT in process_data.py: [-220, -55, -80, 80]
        // West bound -220 = 140°E expressed as an extended western longitude,
        // so Leaflet places the overlay continuously across the antimeridian.
        // Leaflet format: [[south, west], [north, east]]
        var imageBounds = [[-80, -220], [80, -55]];
        var imageUrl = 'data/';

        // Satellite overlay layers — always show the latest frame (_00)
        var geocolorLayer   = L.imageOverlay(imageUrl + 'geocolor_00.png',    imageBounds, {opacity: 0.95});
        var visibleLayer    = L.imageOverlay(imageUrl + 'visible_00.png',     imageBounds, {opacity: 0.85});
        var infraredLayer   = L.imageOverlay(imageUrl + 'infrared_00.png',    imageBounds, {opacity: 0.85});
        var waterVaporLayer = L.imageOverlay(imageUrl + 'water_vapor_00.png', imageBounds, {opacity: 0.85});
        var precipLayer     = L.imageOverlay(imageUrl + 'precip_00.png',      imageBounds, {opacity: 0.90});

        var overlayMaps = {
            "GeoColor (RGB)":       geocolorLayer,
            "Visible (Band 2)":     visibleLayer,
            "Infrared (Band 13)":   infraredLayer,
            "Water Vapor (Band 9)": waterVaporLayer,
            "⚡ Precip Rate (experimental)": precipLayer
        };

        var layersControl = L.control.layers({}, overlayMaps, {collapsed: false}).addTo(map);

        // Show GeoColor by default
        geocolorLayer.addTo(map);

        // ----------------------------------------------------------------
        // Legend definitions
        // ----------------------------------------------------------------

        // Discrete rain-rate scale — MUST match PRECIP_LEVELS / PRECIP_COLORS
        // in process_data.py.
        var PRECIP_BIN_COLORS = [
            '#9fe8ff', '#4fc0f0', '#1878d0', '#17a92a', '#4fd12a',
            '#ffe000', '#ff9000', '#ff3000', '#c00040', '#ff40ff'
        ];

        // Hard-stop gradient so each rain-rate bin reads as a discrete step
        // rather than a continuous ramp.
        function precipGradient() {
            var stops = [];
            var w = 100 / PRECIP_BIN_COLORS.length;
            PRECIP_BIN_COLORS.forEach(function(c, i) {
                stops.push(c + ' ' + (i * w).toFixed(1) + '%');
                stops.push(c + ' ' + ((i + 1) * w).toFixed(1) + '%');
            });
            return 'linear-gradient(to right,' + stops.join(',') + ')';
        }

        var LEGENDS = {
            // Matches estimate_precip_rate() in process_data.py
            precip: {
                title: 'Precipitation Rate — experimental',
                subtitle: 'Estimated from Bands 13 + 9',
                gradient: precipGradient(),
                // Bin edges 0.1 / 0.5 / 2 / 8 / 32 / 100 fall at 0, 20, 40,
                // 60, 80 and 100 % of the bar.
                ticks: ['0.1', '0.5', '2', '8', '32', '100+'],
                unit: 'mm/hr',
                note: 'Inferred from cloud-top temperature — not a radar ' +
                      'measurement. Misses warm rain from low cloud and can ' +
                      'over-read non-raining cirrus.'
            },

            // Matches _ir_colormap() in process_data.py (190 – 310 K)
            infrared: {
                title: 'Infrared — Band 13',
                subtitle: 'Clean IR Longwave (10.35 µm)',
                gradient: 'linear-gradient(to right,' +
                    '#ffffff 0%,'   +   // 190 K
                    '#dd00dd 7%,'   +   // ~199 K
                    '#ff0000 17%,'  +   // ~210 K
                    '#ff5500 27%,'  +   // ~222 K
                    '#ff8800 37%,'  +   // ~233 K  orange
                    '#44cc00 45%,'  +   // ~244 K  green (no yellow)
                    '#00cc00 53%,'  +   // ~254 K
                    '#00cccc 62%,'  +   // ~264 K
                    '#0066ff 72%,'  +   // ~276 K
                    '#001177 87%,'  +   // ~294 K
                    '#060606 100%'  +   // 310 K
                ')',
                ticks: ['190 K', '222 K', '254 K', '282 K', '310 K'],
                unit: 'Brightness Temperature'
            },

            // Matches _wv_colormap() in process_data.py (195 – 280 K)
            watervapor: {
                title: 'Water Vapor — Band 9',
                subtitle: 'Mid-Level Water Vapor (6.95 µm)',
                gradient: 'linear-gradient(to right,' +
                    '#00003c 0%,'   +   // 195 K
                    '#0000cc 18%,'  +   // ~210 K
                    '#0066ee 35%,'  +   // ~225 K
                    '#00bbdd 50%,'  +   // ~238 K
                    '#00bb66 63%,'  +   // ~249 K
                    '#22cc00 74%,'  +   // ~258 K  green (no yellow-green)
                    '#ff8800 84%,'  +   // ~266 K  orange (no yellow)
                    '#ff5500 92%,'  +   // ~272 K
                    '#cc1100 100%'  +   // 280 K
                ')',
                ticks: ['195 K', '217 K', '238 K', '259 K', '280 K'],
                unit: 'Brightness Temperature'
            },

            // Grayscale visible
            visible: {
                title: 'Visible — Band 2',
                subtitle: 'Red Visible (0.64 µm)',
                gradient: 'linear-gradient(to right, #000000, #ffffff)',
                ticks: ['0 %', '25 %', '50 %', '75 %', '100 %'],
                unit: 'Reflectance'
            },

            // GeoColor: informational swatches (no single numeric scale)
            geocolor: null
        };

        function buildLegend(key) {
            var el = document.getElementById('legend');
            if (key === 'geocolor' || !LEGENDS[key]) {
                el.style.display = 'none';
                return;
            }
            var d = LEGENDS[key];
            var html = '<div class="legend-title">' + d.title + '</div>';
            if (d.subtitle) html += '<div class="legend-subtitle">' + d.subtitle + '</div>';
            html += '<div class="legend-bar" style="background:' + d.gradient + '"></div>';
            html += '<div class="legend-ticks">';
            d.ticks.forEach(function(t) { html += '<span>' + t + '</span>'; });
            html += '</div>';
            if (d.unit) html += '<div class="legend-unit">' + d.unit + '</div>';
            if (d.note) html += '<div class="legend-note">' + d.note + '</div>';
            el.innerHTML = html;
            el.style.display = 'block';
        }

        // Priority order when multiple layers are active:
        // Precip > IR > WV > Visible > GeoColor
        var legendPriority = [
            { layer: precipLayer,     key: 'precip'     },
            { layer: infraredLayer,   key: 'infrared'   },
            { layer: waterVaporLayer, key: 'watervapor' },
            { layer: visibleLayer,    key: 'visible'    },
            { layer: geocolorLayer,   key: 'geocolor'   }
        ];

        function updateLegend() {
            for (var i = 0; i < legendPriority.length; i++) {
                if (map.hasLayer(legendPriority[i].layer)) {
                    buildLegend(legendPriority[i].key);
                    return;
                }
            }
            document.getElementById('legend').style.display = 'none';
        }

        // ----------------------------------------------------------------
        // Frame animation — cycles through the 10-frame rolling buffer
        // Frame 00 = newest (LIVE), Frame 09 = oldest (~9 h ago)
        // Plays oldest→newest then loops: 9, 8, 7, …, 1, 0, 9, 8, …
        //
        // Slider convention: value 0 = oldest (frame 09), value 9 = newest (frame 00)
        //   currentFrame  = NUM_FRAMES - 1 - slider.value
        //   slider.value  = NUM_FRAMES - 1 - currentFrame
        // ----------------------------------------------------------------
        var NUM_FRAMES   = 10;
        var currentFrame = NUM_FRAMES - 1;   // start at oldest
        var isPlaying    = true;

        var layerProducts = [
            { layer: geocolorLayer,   product: 'geocolor'    },
            { layer: visibleLayer,    product: 'visible'     },
            { layer: infraredLayer,   product: 'infrared'    },
            { layer: waterVaporLayer, product: 'water_vapor' },
            { layer: precipLayer,     product: 'precip'      }
        ];

        // ----------------------------------------------------------------
        // Tropical Cyclone Sector Overlays
        // Loaded dynamically from data/cyclones.json written by process_data.py.
        // Each active storm gets five product layers at max native resolution
        // (GeoColor 2 km, Visible 0.5 km, Infrared 2 km, Water Vapor 2 km,
        //  Precip Rate 2 km)
        // cropped to a ±SECTOR_DEG box around the storm centre.
        // ----------------------------------------------------------------
        fetch('data/cyclones.json?nocache=' + Date.now())
            .then(function(r) { return r.json(); })
            .then(function(manifest) {
                var sector = manifest.sector_deg || 6.0;
                var storms = manifest.storms || [];
                if (storms.length === 0) return;

                storms.forEach(function(storm) {
                    var lat   = storm.lat;
                    var lon   = storm.lon;
                    var sid   = storm.id;
                    var label = storm.name + ' (' + storm.id.toUpperCase() + ')';
                    // Leaflet imageBounds: [[south, west], [north, east]]
                    var bounds = [
                        [lat - sector, lon - sector],
                        [lat + sector, lon + sector]
                    ];

                    var tcProducts = [
                        { suffix: 'GeoColor (RGB)',       base: 'geocolor_tc_'    + sid, opacity: 0.95 },
                        { suffix: 'Visible (Band 2)',      base: 'visible_tc_'     + sid, opacity: 0.85 },
                        { suffix: 'Infrared (Band 13)',    base: 'infrared_tc_'    + sid, opacity: 0.85 },
                        { suffix: 'Water Vapor (Band 9)', base: 'water_vapor_tc_' + sid, opacity: 0.85 },
                        { suffix: 'Precip Rate (experimental)', base: 'precip_tc_' + sid, opacity: 0.90 }
                    ];

                    tcProducts.forEach(function(p) {
                        var tcLayer = L.imageOverlay(
                            'data/' + p.base + '_00.png',
                            bounds,
                            { opacity: p.opacity }
                        );
                        // Add to control with name "IDA (EP01) — GeoColor (RGB)" etc.
                        layersControl.addOverlay(tcLayer, '\uD83C\uDF00 ' + label + ' \u2014 ' + p.suffix);
                        // Register with the animation system
                        layerProducts.push({ layer: tcLayer, product: p.base });
                        // Keep legend priority up-to-date for TC IR/WV layers
                        if (p.suffix.indexOf('Precip') !== -1) {
                            legendPriority.unshift({ layer: tcLayer, key: 'precip' });
                        } else if (p.suffix.indexOf('Infrared') !== -1) {
                            legendPriority.unshift({ layer: tcLayer, key: 'infrared' });
                        } else if (p.suffix.indexOf('Water Vapor') !== -1) {
                            legendPriority.unshift({ layer: tcLayer, key: 'watervapor' });
                        } else if (p.suffix.indexOf('Visible') !== -1) {
                            legendPriority.unshift({ layer: tcLayer, key: 'visible' });
                        }
                    });
                });
            })
            .catch(function() { /* no cyclones.json yet — off-season, skip silently */ });

        function frameUrl(product, index) {
            var pad = index < 10 ? '0' + index : '' + index;
            return 'data/' + product + '_' + pad + '.png';
        }

        function updateAnimationFrame() {
            layerProducts.forEach(function(lp) {
                if (map.hasLayer(lp.layer)) {
                    lp.layer.setUrl(frameUrl(lp.product, currentFrame));
                }
            });
            var label  = document.getElementById('frame-label');
            var slider = document.getElementById('frame-slider');
            if (currentFrame === 0) {
                label.textContent = '▶ LIVE';
                label.style.color = '#7cf';
            } else {
                label.textContent = '▶ -' + currentFrame + 'h';
                label.style.color = '#fa8';
            }
            // Keep slider in sync (slider 0 = oldest, slider N-1 = newest)
            slider.value = NUM_FRAMES - 1 - currentFrame;
        }

        // Play / Pause button
        document.getElementById('play-pause-btn').addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? '⏸' : '▶';
        });

        // Frame slider — drag or click to jump to any frame
        document.getElementById('frame-slider').addEventListener('input', function() {
            // Pause playback when the user manually selects a frame
            isPlaying = false;
            document.getElementById('play-pause-btn').textContent = '▶';
            currentFrame = NUM_FRAMES - 1 - parseInt(this.value, 10);
            updateAnimationFrame();
        });

        setInterval(function() {
            if (!isPlaying) return;
            // Advance one step older→newer; wrap newest back to oldest
            currentFrame = (currentFrame - 1 + NUM_FRAMES) % NUM_FRAMES;
            updateAnimationFrame();
        }, 1000);

        map.on('layeradd layerremove', function(e) {
            updateLegend();
            // Ensure newly-added layers immediately show the current animation frame
            layerProducts.forEach(function(lp) {
                if (e.layer === lp.layer) {
                    lp.layer.setUrl(frameUrl(lp.product, currentFrame));
                }
            });
        });

        // Set initial legend for the default GeoColor layer (no legend shown)
        updateLegend();

        // ----------------------------------------------------------------
        // Timestamp
        // ----------------------------------------------------------------
        fetch('data/last_updated.txt?nocache=' + Date.now())
            .then(r => r.text())
            .then(t => { document.getElementById('timestamp').textContent = 'Updated: ' + t; })
            .catch(() => { document.getElementById('timestamp').textContent = 'Timestamp unavailable'; });
    </script>
</body>
</html>
